source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = fadeIn, 1, 5, smooth
    animation = fadeOut, 1, 5, smooth
    animation = inputFieldDots, 1, 2, smooth
}

# Your desktop, blurred. Use "path = $wallpaper" instead for your wallpaper.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    color = $text
    position = 0, 160
    halign = center
    valign = center
}

# Date, refreshed every minute
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = $muted
    position = 0, 70
    halign = center
    valign = center
}

# Password box
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 12
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $accent
    fail_color = $error
    fail_text = Wrong password
    placeholder_text = Hi, $USER
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}
