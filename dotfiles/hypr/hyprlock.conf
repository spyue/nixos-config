source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.85, 0.25, 0.85
    animation = fadeIn, 1, 8, smooth
    animation = fadeOut, 1, 8, smooth
    animation = inputFieldDots, 1, 2, smooth
}

# Your desktop, blurred. Use "path = $wallpaper" instead for your wallpaper.
background {
    monitor =
    path = $wallpaper # screenshot
    blur_passes = 1
    blur_size = 8
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = $text
    position = -10, -10
    halign = right
    valign = top
}

# Date, refreshed every minute
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = $muted
    position = 10, -10
    halign = left
    valign = top
}

# Password box
input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    rounding = 12
    outer_color = $accent
    inner_color = $surface
    font_color = $text
    check_color = $accent
    fail_color = $error
    fail_text = Errrr
    placeholder_text = Hi, $USER
    fade_on_empty = false
    position = -10, 10
    halign = right
    valign = bottom
}
